# Build, test and package on Linux and Windows. Every build step calls ./build.sh, so CI and a
# developer's machine run exactly the same commands.
#
#   push / pull request : build + test (+ package) on both systems, upload the packages as artifacts
#   tag v*              : the same, then publish a GitHub Release with both packages and SHA256SUMS.txt
#
# To release:  git tag v0.1.0 && git push origin v0.1.0   (the tag must match the version in CMakeLists.txt)
name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  linux:
    name: Linux build, test, package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        # The X11/Wayland/ALSA headers let the fetched SDL3 be built with a real window and audio backend.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build nasm cmake pkg-config \
            libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxfixes-dev libxss-dev \
            libxkbcommon-dev libwayland-dev libasound2-dev libgl1-mesa-dev

      - name: Environment report
        run: ./build.sh --diagnose --sdl fetch

      - name: Build, test and package (Release)
        run: ./build.sh --release --sdl fetch --werror --package

      - name: Smoke-test the unpacked package from a clean environment
        run: |
          set -eu
          mkdir smoke && tar xzf build/release/game-engine-demo-*-linux-*.tar.gz -C smoke
          exe=$(echo "$PWD"/smoke/*/bin/ge-demo)
          cd /
          env -i PATH=/usr/bin:/bin "$exe" --list-levels | tee /tmp/levels.txt
          grep -qx bunker /tmp/levels.txt
          env -i PATH=/usr/bin:/bin "$exe" --headless --level bunker | tee /tmp/run.txt
          grep -q "level: Bunker" /tmp/run.txt
          if ldd "$exe" | grep -qi sdl3; then echo "package depends on a system SDL3"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: package-linux
          path: |
            build/release/game-engine-demo-*.tar.gz
            build/release/game-engine-demo-*.tar.gz.sha256
          if-no-files-found: error

  linux-checks:
    name: Linux ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Debug with AddressSanitizer + UBSan", args: '--debug --sdl off --werror --sanitize "address;undefined"' }
          - { name: "Release without assembly (C++ fallbacks)", args: "--release --sdl off --asm off --werror" }
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build nasm cmake
      - name: Build and test
        run: ./build.sh ${{ matrix.args }}

  windows:
    name: Windows build, test, package
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up the MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install NASM
        uses: ilammy/setup-nasm@v1

      - name: Make sure Ninja is available
        run: command -v ninja || python -m pip install ninja

      - name: Environment report
        run: ./build.sh --diagnose --sdl fetch

      # Warnings are not errors on Windows yet: MSVC /W4 has never been run on this code. Turn on --werror
      # here once the first run is clean.
      - name: Build, test and package (Release)
        run: ./build.sh --release --sdl fetch --package

      - name: Smoke-test the unpacked package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Get-ChildItem build/release/game-engine-demo-*-windows-*.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath smoke
          $exe = (Get-ChildItem smoke -Recurse -Filter ge-demo.exe | Select-Object -First 1).FullName
          Write-Host "exe: $exe"
          Push-Location $env:TEMP
          $levels = & $exe --list-levels
          Write-Host ($levels -join ", ")
          if ($levels -notcontains 'bunker') { throw "bunker level not found next to the exe" }
          $run = & $exe --headless --level bunker
          $run | Write-Host
          if (-not ($run -match 'level: Bunker')) { throw "demo did not run the bunker level" }
          Pop-Location

      - uses: actions/upload-artifact@v4
        with:
          name: package-windows
          path: |
            build/release/game-engine-demo-*.zip
            build/release/game-engine-demo-*.zip.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, linux-checks, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the project version
        run: |
          version=$(grep -oP '^project\(GameEngine VERSION \K[0-9.]+' CMakeLists.txt)
          tag="${GITHUB_REF_NAME#v}"
          echo "CMake version: $version, tag: $tag"
          test "$version" = "$tag"

      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: dist

      - name: Combine checksums
        run: |
          cd dist
          ls -l
          sha256sum game-engine-demo-* | grep -v '\.sha256$' > SHA256SUMS.txt
          cat SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
