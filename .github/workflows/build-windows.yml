name: Windows

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: MSVC ${{ matrix.build_type }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install NASM and Ninja
        shell: pwsh
        run: |
          choco install nasm ninja -y --no-progress
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      # MSVC has not been verified locally yet: /W4 warnings are not errors here.
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DGE_ASM=AUTO
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Demo (headless)
        run: ./build/ge-demo.exe --frames 60
