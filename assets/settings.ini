; Game Engine settings. Copy this file next to the executable as settings.ini (or pass
; --settings FILE). Command-line options override these values.

width = 320
height = 200
fov = 66
window_scale = 3
textured = true
mouse_sensitivity = 0.0025
audio = true
volume = 0.7
capture_mouse = true
; level = hall

[keys]
; SDL key names. Several keys per action are separated by commas.
forward = W,Up
backward = S,Down
left = A
right = D
turn_left = Left
turn_right = Right
fire = Space
reload = R
use = E
debug = F3
pause = Escape,P
confirm = Return,Space
quit_menu = Q
