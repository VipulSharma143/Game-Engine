# Manual build of the Linux demo binary. Proper release packaging is planned, not implemented.
name: Release build

on:
  workflow_dispatch:

jobs:
  linux-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nasm cmake
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGE_WARNINGS_AS_ERRORS=ON
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: ge-demo-linux-x86_64
          path: build/ge-demo
