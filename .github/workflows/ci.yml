# The only workflow. Linux and Windows build, test and package in parallel; every build step is a call to
# ./build.sh, so CI runs the same commands as a developer machine. Two products come out of it:
#   FunkShot (the game)  - funkshot_<version>_amd64.deb and FunkShot-Setup.exe
#   SORTED   (the engine, with the SORTED Viewer program and the developer files) - sorted_<version>_amd64.deb and SORTED-Setup.exe
#
#   push / pull request to main : build + test + package both platforms, keep the packages 7 days as artifacts
#   tag vX.Y.Z                  : the same, then ONE GitHub Release with those four packages and
#                                 SHA256SUMS.txt - published only if both builds succeeded
#
# Tags are created by ./release.sh on a developer machine, never by this workflow. See docs/CI_CD.md.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}   # newer pushes replace older runs, a release run is never cancelled

jobs:
  linux:
    name: Linux x86-64 (FunkShot .deb, SORTED .deb)
    # ./release.sh pushes the release commit and its tag together; the tag run builds it, so skip the duplicate.
    if: "github.event_name == 'workflow_dispatch' || github.ref_type == 'tag' || !startsWith(github.event.head_commit.message || '', 'chore(release): v')"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        # The X11/Wayland/ALSA headers let the fetched SDL3 be built with a real window and audio backend.
        run: |
          echo "IMAGE=${ImageVersion:-unknown}" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm pkg-config \
            libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxfixes-dev libxss-dev \
            libxkbcommon-dev libwayland-dev libasound2-dev libgl1-mesa-dev

      # SDL3 is about 60% of a clean build. The cache holds the whole build tree (Ninja needs its log next to the
      # objects); changed sources are rebuilt, the unchanged SDL3 objects are not. The key changes with the
      # runner image or Dependencies.cmake (SDL3 version).
      - name: Restore the SDL3 build
        uses: actions/cache@v4
        with:
          path: |
            build/release
            !build/release/*.deb
          key: linux-build-${{ env.IMAGE }}-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Check the changelog
        run: |
          python3 tools/test_changelog.py
          python3 tools/changelog.py check

      - name: Build, test and package (Release)
        run: bash ./build.sh --release --sdl fetch --werror --package

      - name: Install both packages; run FunkShot from outside the repository
        run: |
          set -eu
          sudo apt-get install -y ./build/release/funkshot_*_amd64.deb ./build/release/sorted_*_amd64.deb
          cd /
          levels=$(env -i PATH=/usr/bin:/bin funkshot --list-levels)
          echo "$levels"
          echo "$levels" | grep -qx bunker
          run=$(env -i PATH=/usr/bin:/bin funkshot --headless --level bunker)
          echo "$run" | grep -q "level: Bunker"
          viewer=$(env -i PATH=/usr/bin:/bin sorted-viewer --list-levels)     # SORTED Viewer finds its own levels
          echo "$viewer" | grep -qx bunker
          env -i PATH=/usr/bin:/bin sorted-viewer --headless --frames 60 | grep -q "SORTED Viewer: 60 frames"
          test -f /usr/share/applications/sorted-viewer.desktop
          test -f /usr/share/applications/funkshot.desktop

      - name: Build a program against the installed SORTED (find_package without hints)
        run: bash tools/sdk-smoke-test.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            build/release/funkshot_*_amd64.deb
            build/release/sorted_*_amd64.deb
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows x64 (FunkShot Setup.exe, SORTED Setup.exe)
    if: "github.event_name == 'workflow_dispatch' || github.ref_type == 'tag' || !startsWith(github.event.head_commit.message || '', 'chore(release): v')"
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Record the runner image version
        run: echo "IMAGE=${ImageVersion:-unknown}" >> "$GITHUB_ENV"

      - name: Set up the MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install NASM
        uses: ilammy/setup-nasm@v1

      - name: Install Ninja and Inno Setup if the image lacks them
        run: |
          command -v ninja || python -m pip install ninja
          [ -x "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ] || choco install innosetup -y --no-progress

      - name: Restore the SDL3 build
        uses: actions/cache@v4
        with:
          path: |
            build/release
            !build/release/*-Setup.exe
            !build/release/stage-*
            !build/release/installer-stage
          key: windows-build-${{ env.IMAGE }}-${{ hashFiles('cmake/Dependencies.cmake') }}

      # Warnings are not errors on Windows yet: MSVC /W4 has not been run against this code in CI. Add --werror
      # here once a run is clean.
      - name: Build, test and package (Release)
        run: bash ./build.sh --release --sdl fetch --package

      # If the build script exits on a test failure, rerun the failed CTest cases
      # verbosely so the assertion and diagnostic output are visible in the Actions log.
      - name: Diagnose failed Windows tests
        if: failure()
        continue-on-error: true
        run: |
          if [ -f build/release/Testing/Temporary/LastTestsFailed.log ]; then
            ctest --test-dir build/release --rerun-failed --output-on-failure --verbose
          else
            echo "CTest failed-test list was not found."
            if [ -f build/release/Testing/Temporary/LastTest.log ]; then
              cat build/release/Testing/Temporary/LastTest.log
            fi
          fi

      - name: Upload Windows test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-logs
          path: |
            build/release/Testing/Temporary/LastTest.log
            build/release/Testing/Temporary/LastTestsFailed.log
            build/release/Testing/Temporary/CTestCostData.txt
            build/release/logs/test.log
          if-no-files-found: warn
          retention-days: 7

      - name: Install FunkShot-Setup.exe, run the game, uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Resolve-Path build/release/FunkShot-Setup.exe).Path
          $dir = Join-Path $env:RUNNER_TEMP 'FunkShot'
          $log = Join-Path $env:RUNNER_TEMP 'setup.log'
          $p = Start-Process $setup -Wait -PassThru -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=$dir", "/LOG=$log"
          if ($p.ExitCode -ne 0) { Get-Content $log -Tail 40; throw "installer exited with $($p.ExitCode)" }
          $exe = Join-Path $dir 'bin\funkshot.exe'
          if (-not (Test-Path $exe)) { throw "funkshot.exe was not installed" }
          $shortcut = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\FunkShot.lnk'
          if (-not (Test-Path $shortcut)) { throw "Start Menu shortcut is missing" }
          Push-Location $env:TEMP    # not the install or source directory
          $levels = & $exe --list-levels
          Write-Host ($levels -join ', ')
          if ($levels -notcontains 'bunker') { throw "installed game cannot find its assets" }
          $run = & $exe --headless --level bunker
          if (-not ($run -match 'level: Bunker')) { throw "installed game did not run the bunker level" }
          Pop-Location
          Start-Process (Join-Path $dir 'unins000.exe') -Wait -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          for ($i = 0; $i -lt 60 -and (Test-Path $exe); $i++) { Start-Sleep -Milliseconds 500 }   # the uninstaller finishes in a copy of itself
          if (Test-Path $exe) { throw "uninstall left funkshot.exe behind" }

      - name: Install SORTED-Setup.exe, run the Viewer, build a program against it, uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Resolve-Path build/release/SORTED-Setup.exe).Path
          $dir = Join-Path $env:RUNNER_TEMP 'SORTED'
          $log = Join-Path $env:RUNNER_TEMP 'sorted-setup.log'
          $p = Start-Process $setup -Wait -PassThru -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=$dir", "/LOG=$log"
          if ($p.ExitCode -ne 0) { Get-Content $log -Tail 40; throw "SORTED installer exited with $($p.ExitCode)" }
          $viewer = Join-Path $dir 'bin\sorted-viewer.exe'
          if (-not (Test-Path $viewer)) { throw "sorted-viewer.exe was not installed" }
          $shortcut = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\SORTED Viewer.lnk'
          if (-not (Test-Path $shortcut)) { throw "Start Menu shortcut for SORTED Viewer is missing" }
          Push-Location $env:TEMP    # not the install or source directory
          $levels = & $viewer --list-levels
          if ($levels -notcontains 'bunker') { throw "installed SORTED Viewer cannot find its levels" }
          $run = & $viewer --headless --frames 60
          if (-not ($run -match 'SORTED Viewer: 60 frames')) { throw "installed SORTED Viewer did not run" }
          Pop-Location
          if (-not (Test-Path (Join-Path $dir 'lib\cmake\SORTED\SORTEDConfig.cmake'))) { throw "SORTED package was not installed" }
          # the installer's "set SORTED_ROOT" task must have written the per-user variable
          $root = [Environment]::GetEnvironmentVariable('SORTED_ROOT', 'User')
          if ($root -ne $dir) { throw "SORTED_ROOT is '$root', expected '$dir'" }
          $env:SORTED_ROOT = $root   # this process does not see the registry change; a new terminal would
          & bash tools/sdk-smoke-test.sh
          if ($LASTEXITCODE -ne 0) { throw "building against the installed SDK failed" }
          $unins = Join-Path $dir 'unins000.exe'
          Start-Process $unins -Wait -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          for ($i = 0; $i -lt 60 -and (Test-Path (Join-Path $dir 'lib')); $i++) { Start-Sleep -Milliseconds 500 }
          if (Test-Path (Join-Path $dir 'lib')) { throw "SORTED uninstall left files behind" }
          if ([Environment]::GetEnvironmentVariable('SORTED_ROOT', 'User')) { throw "uninstall left SORTED_ROOT set" }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            build/release/FunkShot-Setup.exe
            build/release/SORTED-Setup.exe
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: [linux, windows]    # runs only when both builds succeeded
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write          # the only job that can write to the repository
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate the tag
        run: |
          set -eu
          git merge-base --is-ancestor "$(git rev-parse "$TAG^{commit}")" origin/main \
            || { echo "::error::$TAG is not on main"; exit 1; }
          python3 tools/changelog.py check --tag "$TAG"    # tag format, CMakeLists.txt version, dated changelog entry
          if gh release view "$TAG" >/dev/null 2>&1; then echo "::error::a release for $TAG already exists"; exit 1; fi

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create the release
        run: |
          set -eu
          version="${TAG#v}"
          cd dist
          ls -l
          files="FunkShot-Setup.exe funkshot_${version}_amd64.deb SORTED-Setup.exe sorted_${version}_amd64.deb"
          for f in $files; do test -f "$f"; done
          test "$(ls | wc -l)" = 4    # exactly these four, nothing else
          sha256sum $files > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          cd ..
          python3 tools/changelog.py notes "$version" > notes.md
          gh release create "$TAG" dist/* --verify-tag --title "Game Engine $TAG" --notes-file notes.md
